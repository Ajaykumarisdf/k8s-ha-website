apiVersion: v1
kind: Service
metadata:
  name: ha-website-service
spec:
  type: NodePort
  selector:
    app: ha-website
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30837
  # NOTE: sessionAffinity removed to demonstrate HA load balancing
  # across different backend pods in the dashboard
