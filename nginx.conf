server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Shared AWS EFS uploads directly served across all frontend pods
    location /efs-data/ {
        alias /usr/share/nginx/html/efs-data/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, no-transform";
        try_files $uri @efs_api_fallback;
    }

    location @efs_api_fallback {
        rewrite ^/efs-data/images/(.*)$ /api/efs-images/$1 break;
        proxy_pass http://guestbook-api-service:3000;
    }

    # Reverse proxy API calls to the backend Kubernetes service
    location /api {
        proxy_pass http://guestbook-api-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
